<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private interest review | SRCHN</title><link rel="stylesheet" href="/clubs/style.css"><link rel="stylesheet" href="/assets/fonts/typography-base.css"><main><h1>Private interest requests</h1><p>Owner sign-in required through the existing review page. This list is private. No request here is a booking, membership or contact sent to an operator.</p><a href="/review/">Reviewer sign-in</a><button id="refresh">Refresh requests</button><p id="message" role="status"></p><div id="records"></div></main><script>document.querySelector('#refresh').onclick=async()=>{const m=document.querySelector('#message');try{const r=await fetch('/review/api/discovery-requests'),d=await r.json();if(!r.ok)throw Error(d.error||'Unavailable');const out=document.querySelector('#records');out.replaceChildren();for(const x of d.requests){const a=document.createElement('article');a.className='listing';for(const v of [x.id,x.category+' / '+x.listing,x.note,x.status,new Date(x.created_at).toLocaleString()]){const p=document.createElement('p');p.textContent=v;a.append(p)}out.append(a)}m.textContent=d.requests.length+' saved requests. Review only, not confirmed.'}catch(e){m.textContent=e.message}};</script></html>
