<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Discover Bengaluru | SRCHN preview</title>
<style>
:root{--bg:#fffdf8;--ink:#14213d;--blue:#1d4ed8;--mut:#5b6478;--line:#e7e2d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line)}header a{color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;font-weight:600}header .sp{flex:1}@media(max-width:600px){header{flex-wrap:wrap;gap:4px 10px;padding:6px 12px}header a{font-size:13px;white-space:nowrap}header img{height:44px!important}header .note{display:none}}
h1{font-size:1.5rem;margin:14px 16px 2px}.tag{margin:0 16px 8px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.chips{mask-image:linear-gradient(90deg,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}.chips button{flex:none;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:0 16px;font:inherit;cursor:pointer;scroll-snap-align:start}.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.feed{padding:0 12px 24px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:stretch}@media(min-width:760px){.feed{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}@media(min-width:1100px){.feed{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.card{break-inside:avoid;margin:0;max-width:460px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);position:relative}
.card button.open{display:block;width:100%;border:0;padding:0;background:#e9e4d6;cursor:pointer;position:relative;text-align:left;color:inherit;font:inherit}.card img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}.card{display:flex;flex-direction:column;height:100%}.card .acts{margin-top:auto}
.meta{padding:8px 10px 10px}.meta b{display:block;font-size:.95rem}.meta span{color:var(--mut);font-size:.82rem;display:block}.meta .nt{color:#9a3412;font-size:.78rem;margin-top:2px}.meta .at{font-size:.7rem;margin-top:3px}.meta .at a{color:var(--mut)}
.cap{position:absolute;right:6px;bottom:6px;background:rgba(20,33,61,.75);color:#fff;border-radius:8px;font-size:.62rem;padding:1px 6px;white-space:nowrap}
.acts{display:flex;border-top:1px solid var(--line)}.acts button{flex:1;min-height:44px;border:0;background:#fff;font:inherit;cursor:pointer;color:var(--ink)}.acts button+button{border-left:1px solid var(--line)}
.empty{padding:18px 16px;margin:0 16px 16px;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%}dialog::backdrop{background:rgba(20,33,61,.6)}dialog img{width:100%;max-height:60vh;object-fit:contain;background:#14213d;display:block}.d{padding:14px 16px 16px}.d p{margin:6px 0}.d a{color:var(--blue)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row a,.row button{min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font:inherit;text-decoration:none;color:var(--ink);cursor:pointer}
.chipl{font-size:.8rem;color:var(--mut)}.note{font-size:.8rem;color:var(--mut);margin:0 16px 20px}:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}[hidden]{display:none!important}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:.9rem;z-index:9}
</style><style>.lg{display:block}.lgw{display:block;width:120px;height:26px;overflow:hidden;position:relative}.lgw img{position:absolute;width:139px;height:139px;max-width:none;left:-9.6px;top:-57.6px}</style><style>:root{--bg:#fff}body{background:#fff!important}</style><!-- SRCHN brand assets -->
<link rel="icon" href="/assets/brand/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/brand/logos/svg/srchn-icon-light.svg"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#ffffff"><meta property="og:site_name" content="SRCHN"><meta property="og:image" content="https://srchn.in/assets/brand/social/1x1/srchn-icon-only-light-1080.png"><meta property="og:image:width" content="1080"><meta property="og:image:height" content="1080"><meta name="twitter:card" content="summary"><meta name="twitter:image" content="https://srchn.in/assets/brand/social/1x1/srchn-icon-only-light-1080.png"><link rel="stylesheet" href="/assets/brand/brand.css">
<!-- /SRCHN brand assets --><link rel="stylesheet" href="/assets/fonts/typography-base.css"></head><body>
<header><a href="/" aria-label="SRCHN home" class="lg brand-logo-link"><img class="brand-logo brand-logo-horizontal" src="/assets/brand/logos/png/srchn-horizontal-light-1500.png" alt="SRCHN, see it before you go" width="170" height="48" style="height:60px;width:auto"><img class="brand-logo brand-logo-icon" src="/assets/brand/logos/svg/srchn-icon-light.svg" alt="SRCHN" width="40" height="40" loading="eager" decoding="async"></a><a href="/studio/">Creator studio</a><a href="https://bang-p12.srchn-city-preview.pages.dev/preview/">Your Local Buddy</a><span class="sp"></span><span class="note" style="margin:0">Preview</span></header>
<div role="region" aria-label="Feed introduction"><h1>See it before you go.</h1><p class="tag">Discover places, spaces and experiences in Bengaluru.</p></div>
<div role="region" aria-label="Feed filters"><div class="chips" id="chips" role="group" aria-label="Categories"></div></div>
<div id="empty" class="empty" hidden></div>
<main class="feed" id="feed"></main>
<div role="region" aria-label="Photo licence note"><p class="note">Sample photos from Pexels (free-use licence), each linked to its source. They are not SRCHN listings or venue-supplied media.</p></div>
<dialog id="dlg" aria-label="Details"><div id="dbody"></div></dialog><div class="toast" id="toast" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s);
const CATS=['Live','Work','Eat','Drink','Play','Shop','Travel','Events','Movies','Clubs'];
const MAP={'Homes & rentals':'Homes & rentals','Offices & coworking':'Offices & coworking','Food & cafés':'Food & cafés','Travel & stays':'Travel & stays','Shopping & retail':'Shopping & retail','Sports & entertainment':'Sports & entertainment','Local experiences':'Local experiences'};
let items=[],cat='All',saved=new Set(JSON.parse(localStorage.getItem('srchn-feed.saved')||'[]'));
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function chips(){const box=$('#chips');box.replaceChildren();['All',...CATS].forEach(c=>{const b=el('button',null,c);b.type='button';b.setAttribute('aria-pressed',c===cat);b.onclick=()=>{cat=c;chips();render();const a=$('#chips [aria-pressed=true]');a&&a.scrollIntoView({inline:'center',block:'nearest'})};box.append(b)});const a=box.querySelector('[aria-pressed=true]');}
function share(it){const url=location.origin+'/feed/#'+it.id,data={title:it.title+' - SRCHN',text:it.title+', '+it.locality,url};if(navigator.share)navigator.share(data).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast('Could not copy. Link: '+url));else toast(url)}
function toggleSave(it,btn){saved.has(it.id)?saved.delete(it.id):saved.add(it.id);try{localStorage.setItem('srchn-feed.saved',JSON.stringify([...saved]))}catch{toast('Could not save on this device');return}btn.textContent=saved.has(it.id)?'Saved':'Save';btn.setAttribute('aria-pressed',saved.has(it.id));toast(saved.has(it.id)?'Saved on this device only':'Removed')}
function open(it){const b=$('#dbody');b.replaceChildren();const im=el('img');im.src=it.img;im.alt=it.title+', '+it.locality+' ('+it.taken+')';const d=el('div','d');d.append(el('b',null,it.title),el('p',null,it.category+' · '+it.locality));
 const ph=el('p',null,'Photo: ');const a=el('a',null,it.creator||'Unknown author');a.href=it.source;a.target='_blank';a.rel='noopener';ph.append(a,document.createTextNode(', '));const l=el('a',null,it.licence);l.href=it.licence_url;l.target='_blank';l.rel='noopener';ph.append(l,document.createTextNode(' via Wikimedia Commons.'));d.append(ph,el('p',null,'Taken '+it.taken+'. '+it.note+'. Resized for this page; shared under '+it.licence+'.'),el('p','chipl','No price · No hours · No availability'));
 const row=el('div','row');const m=el('a',null,'Find on map');m.href='https://www.openstreetmap.org/search?query='+encodeURIComponent(it.title+' '+it.locality+' Bengaluru');m.target='_blank';m.rel='noopener';const g=el('a',null,'Ask Your Local Buddy');g.href='/bangalore/';const p=el('a',null,'More on SRCHN');p.href='/open/';const c=el('button',null,'Close');c.type='button';c.onclick=()=>$('#dlg').close();row.append(g,p,c);d.append(row);b.append(im,d);$('#dlg').showModal();history.replaceState(null,'','#'+it.id)}
function render(){const f=$('#feed');f.replaceChildren();const list=items.filter(i=>cat==='All'||i.category===cat);const e=$('#empty');
 if(cat!=='All'&&!list.length){e.hidden=false;e.textContent='No authorised photos or posts for "'+cat+'" yet, so nothing is shown. Try Your Local Buddy, or add your own in the creator studio once publishing opens.'}else e.hidden=true;
 list.forEach(it=>{const c=el('article','card');const o=el('button','open');o.type='button';o.setAttribute('aria-label','Photo, '+it.taken+'. Open '+it.title);const im=el('img');im.src=it.img;im.width=it.w;im.height=it.h;im.loading='lazy';im.decoding='async';im.alt=it.title+', '+it.locality;o.append(im,el('span','cap','Photo, '+it.taken));o.onclick=()=>open(it);const m=el('div','meta');m.append(el('b',null,it.title),el('span',null,it.locality+' · '+it.category),el('span','nt',it.note+'.'));const at=el('span','at');at.append(document.createTextNode('© '));const aa=el('a',null,it.creator);aa.href=it.source;aa.target='_blank';aa.rel='noopener';at.append(aa,document.createTextNode(' · '));const al=el('a',null,it.licence);al.href=it.licence_url;al.target='_blank';al.rel='noopener';at.append(al);m.append(at);const a=el('div','acts');const s=el('button',null,saved.has(it.id)?'Saved':'Save');s.type='button';s.setAttribute('aria-pressed',saved.has(it.id));s.onclick=()=>toggleSave(it,s);const sh=el('button',null,'Share');sh.type='button';sh.onclick=()=>share(it);a.append(s,sh);c.append(o,m,a);f.append(c)})}
fetch('media.json').then(r=>r.json()).then(j=>{items=j;{const q=new URLSearchParams(location.search).get('c');if(q==='Community'){location.replace('/clubs/');return;}if(q&&CATS.includes(q))cat=q;}chips();render();const h=location.hash.slice(1),it=items.find(i=>i.id===h);if(it)open(it)}).catch(()=>{chips();$('#empty').hidden=false;$('#empty').textContent='The photo list could not load. Check your connection and reload.'});
</script></body></html>
